include:
    - component: $CI_SERVER_FQDN/home-lab/automations/docker-compose-service-deployment@v2.1.0
      inputs:
          vm-hostname: ha.vm.xbhl.intranet
          vm-ssh-username: $SSH_USER
          vm-ssh-private-key: $SSH_PRIVATE_KEY
          service-name: frigate
          container-name: frigate
          container-location: /opt/containers/frigate
          cloudflare-dns-strategy: "direct"
          cloudflare-dns-entry-name: frigate.ha.intranet.xbhl.online
          cloudflare-zone-id: $CLOUDFLARE_ZONE_ID
          cloudflare-dns-api-token: $CLOUDFLARE_DNS_API_TOKEN
          delete-existing-container-files: true
          
.preconfigure-run-script:
    script:
        - export NETWORK_NAME="ha"
        - export NETWORK_DRIVER="bridge"
        - !reference [.base:docker:network:ensure, script]
        - export NETWORK_NAME="proxy"

setup:generate-build-artifacts:
    script:
        - cp src/.env $BUILD_ARTIFACTS_DIR
        - sed -i "s|^MQTT_HOSTNAME=.*|MQTT_HOSTNAME=${MQTT_HOSTNAME}|" $BUILD_ARTIFACTS_DIR/.env
        - sed -i "s|^MQTT_USERNAME=.*|MQTT_USERNAME=${MQTT_USERNAME}|" $BUILD_ARTIFACTS_DIR/.env
        - sed -i "s|^MQTT_PASSWORD=.*|MQTT_PASSWORD=${MQTT_PASSWORD}|" $BUILD_ARTIFACTS_DIR/.env
        - sed -i "s|^TAPO_C260_BEDROOM_PASSWORD=.*|TAPO_C260_BEDROOM_PASSWORD=${TAPO_C260_BEDROOM_PASSWORD}|" $BUILD_ARTIFACTS_DIR/.env


