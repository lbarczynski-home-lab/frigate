services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:0.17.2
    shm_size: "256mb"
    configs:
      - source: frigate_config_yaml
        target: /config/config.yaml
    volumes:
      - config:/config
      - storage:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    environment:
      - FRIGATE_MQTT_HOST=${MQTT_HOSTNAME:?err}
      - FRIGATE_MQTT_USER=${MQTT_USERNAME:?err}
      - FRIGATE_MQTT_PASSWORD=${MQTT_PASSWORD:?err}
      - FRIGATE_TAPO_C260_BEDROOM_HOST=${TAPO_C260_BEDROOM_HOSTNAME:?err}
      - FRIGATE_TAPO_C260_BEDROOM_USERNAME=${TAPO_C260_BEDROOM_USERNAME:?err}
      - FRIGATE_TAPO_C260_BEDROOM_PASSWORD=${TAPO_C260_BEDROOM_PASSWORD:?err}
    networks:
      - ha
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frigate-router.rule=Host(`frigate.ha.intranet.xbhl.online`)"
      - "traefik.http.routers.frigate-router.entrypoints=websecure"
      - "traefik.http.routers.frigate-router.tls=true"
      - "traefik.http.routers.frigate-router.service=frigate"
      - "traefik.http.routers.frigate-router.middlewares=authelia@file"
      - "traefik.http.services.frigate.loadbalancer.server.port=8971"
      - "traefik.docker.network=proxy"
      - 'wud.watch=true'
      - 'wud.tag.include=^\d+\.\d+\.\d+$$'
      - "wud.link.template=https://github.com/blakeblackshear/frigate/releases/tag/v$${major}.$${minor}.$${patch}"
    stop_grace_period: 30s
    restart: unless-stopped

configs:
  frigate_config_yaml:
    file: ./config.yaml

volumes:
  config:
    driver: local

  storage:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=nas.srv.xbhl.intranet,rw,soft,timeo=100,nolock"
      device: ":/share/NFSv=4/RemoteStorage/Monitoring"

networks:
  ha:
    external: true
  proxy:
    external: true
