mqtt:
  host: "{FRIGATE_MQTT_HOST}"
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"

go2rtc:
  streams:
    tapo_c260_bedroom_source_4k: #h.265
      - rtsp://{FRIGATE_TAPO_C260_BEDROOM_USERNAME}:{FRIGATE_TAPO_C260_BEDROOM_PASSWORD}@10.21.255.191:554/stream1#tcp#backchannel=false

    tapo_c260_bedroom_source_720p: #h.264 (lower resolution)
      - rtsp://{FRIGATE_TAPO_C260_BEDROOM_USERNAME}:{FRIGATE_TAPO_C260_BEDROOM_PASSWORD}@10.21.255.191:554/stream2#tcp#backchannel=false

    tapo_c260_bedroom: #h.264
      - ffmpeg:tapo_c260_bedroom_source_4k#video=h264#audio=aac

cameras:
  tapo_c260_bedroom:
    onvif:
      host: 10.21.255.191
      port: 2020
      user: "{FRIGATE_TAPO_C260_BEDROOM_USERNAME}"
      password: "{FRIGATE_TAPO_C260_BEDROOM_PASSWORD}"
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/tapo_c260_bedroom
          input_args: preset-rtsp-restream
          roles:
            - record
            - audio
        - path: rtsp://127.0.0.1:8554/tapo_c260_bedroom_source_720p
          input_args: preset-rtsp-restream
          roles:
            - detect

    audio:
      enabled: true
      listen:
        - crying
        - bark

    detect:
      enabled: false
    record:
      enabled: false
    snapshots:
      enabled: false
